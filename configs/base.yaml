experiment:
  seed: 1234
  deterministic: false         # true = bitwise-reproducible training on the same hardware and GPU count (~6-7% slower)

model:
  dtype: bfloat16
  attn_kernel: auto            # auto | fa2 | fa3 (auto = FA3 on Hopper, FA2 elsewhere)
  gradient_checkpointing: true
  ckpt_every_n_layers: 2       # recompute every 2nd decoder layer ...
  ckpt_relax_max_tokens: 88000 # ... unless a micro-batch exceeds this many tokens (then every layer)
  reinit_weights: false
  use_liger: true

training:
  learning_rate: 5.0e-5        # constant for the whole run, no warmup
  effective_batch_size: 768
  save_steps: 500
  accuracy_window: 800
  head: sparse                 # sparse | full
  ddp_grad_average: false      # false = the paper's setting (no cross-rank gradient averaging)
  max_total_pflops: 0          # compute budget in PFLOPs (6N x tokens), checked every save_steps; 0 = none

curriculum:
  accuracy_threshold: 0.98
  min_steps_per_stage: 200
  check_every: 50
  breadth: 2                   # edge budget per unit lookahead; 2 = goal path + one distractor (the paper)
  shuffled_mixture: null       # exposure-matched shuffled control, 'L:steps,...' from a curriculum run; null = off

data:
  vocab_pool: none             # none | grow | fixed (fixed ID -> attribute-name dictionary; none = the paper's main runs)
  max_input_size: 0            # generator context n; 0 = 6 x curriculum.max_lookahead
  instruction_mix_ratio: 0.0

eval:
  samples: 1000
  stage_eval: true
  stage_eval_every: 8
  eval_every_steps: 0
  print_examples: 0
  persist_every: 2000
  save_stage_checkpoints: true
