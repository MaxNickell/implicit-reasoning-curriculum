experiment:
  seed: 1234
  deterministic: false

model:
  dtype: bfloat16
  gradient_checkpointing: true
  reinit_weights: false
  use_liger: true

training:
  learning_rate: 5.0e-5
  effective_batch_size: 768
  warmup_steps: 100
  save_steps: 500
  accuracy_window: 1000

curriculum:
  accuracy_threshold: 0.98
  min_steps_per_stage: 200
  check_every: 50

data:
  fixed_vocab: false
  instruction_mix_ratio: 0.0

eval:
  samples: 1000
  stage_eval: true
  stage_eval_every: 8
  eval_every_steps: 0
  print_examples: 0
  persist_every: 2000
  save_stage_checkpoints: true
