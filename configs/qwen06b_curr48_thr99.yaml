_base_: base.yaml

# Qwen3-0.6B curriculum of Section 4.7 at the 99% gate (Table 3, Qwen3-0.6B curriculum column): s=1 to L=96, gate
# after at least 200 steps checked every 25, lr 5e-5, batch 48 x 4 ranks x grad-accum 4 = 768, 6% of every batch
# drawn from allenai/Dolci-Instruct-SFT under the chat template, held-out evaluation at every eighth L, 300,000
# PFLOPs budget. Source: nl/tuning_job_qwen06b_curr48_thr99.sh (run dir job_qwen06b_curr48_thr99); the same run as
# qwen06b_curr48_thr98.yaml with only the threshold changed. The downstream tables use the stage checkpoint at L=48.
# The archived run gated on W=200; the paper reports 800.
# Held-out set:  python -m search_ft.generate_heldout --max_lookahead 96 --samples 500

experiment:
  name: qwen06b_curr48_thr99

model:
  name: "Qwen/Qwen3-0.6B"

training:
  effective_batch_size: 768
  per_device_batch_size: 48
  accuracy_window: 800
  max_total_pflops: 300000

curriculum:
  base_lookahead: 1
  max_lookahead: 96
  lookahead_step: 1
  accuracy_threshold: 0.99
  min_steps_per_stage: 200
  check_every: 25

data:
  instruction_mix_ratio: 0.06

eval:
  persist_every: 500
