_base_: base.yaml

# Exposure-matched shuffled control for the s=8 curriculum: the same multiset of examples the curriculum saw up to
# its 98% crossing on the L = 128 held-out set, in uniformly random order. The mixture is that run's steps per
# stage (768 examples per step); its L = 96 stage ran at n = 576, where the generator caps the lookahead at 94, so
# it enters as L = 94. No stage advancement: accuracy_threshold 1.01 is never met and base_lookahead 120 is only
# the logged L. Stops at the curriculum's step count. Same batch geometry as the curriculum run (48 x 4 x 4 = 768).
# Held-out set:  python -m search_ft.generate_heldout --max_lookahead 128 --samples 500

experiment:
  name: qwen06b_s8_shuffled_matched

model:
  name: "Qwen/Qwen3-0.6B"

training:
  effective_batch_size: 768
  per_device_batch_size: 48
  max_steps: 22125
  save_steps: 500
  accuracy_window: 800         # The archived control gated on W=200; the paper reports 800. The gate never fires here (threshold 1.01).

curriculum:
  base_lookahead: 120
  max_lookahead: 128
  lookahead_step: 8
  accuracy_threshold: 1.01
  min_steps_per_stage: 200
  check_every: 25
  shuffled_mixture: "8:250,16:850,24:1575,32:1675,40:925,48:2000,56:1550,64:1525,72:825,80:2550,88:2000,94:4025,104:200,112:1000,120:1175"

eval:
  eval_every_steps: 1000
  persist_every: 250
